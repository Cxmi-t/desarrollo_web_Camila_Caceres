<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avistamientos - Evaluación y Búsqueda</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; background: #f6f8f7; color: #1f2933; }
        h1 { margin-bottom: 16px; }
        .barra-busqueda { margin-bottom: 20px; display: flex; gap: 8px; align-items: center; }
        input[type="text"] { padding: 8px 12px; width: 320px; border: 1px solid #cbd2d9; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        th, td { padding: 10px 12px; border-bottom: 1px solid #e4e7eb; text-align: left; }
        th { background: #2f5d46; color: #fff; }
        select { padding: 5px 8px; border-radius: 4px; border: 1px solid #cbd2d9; }
        button { padding: 6px 12px; background: #2f5d46; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #234735; }
        .mensaje { margin-top: 8px; font-size: 0.9em; color: #1e6b3a; min-height: 18px; }
        .error { color: #b42318; }
    </style>
</head>
<body>

    <h1>Avistamientos de Aves</h1>

    <div class="barra-busqueda">
        <label for="buscador"><strong>Buscar:</strong></label>
        <input type="text" id="buscador" th:value="${q}" placeholder="Ave, lugar, comuna, tipo o voluntario...">
    </div>

    <table>
        <thead>
            <tr>
                <th>Ave</th>
                <th>Tipo</th>
                <th>Lugar</th>
                <th>Comuna</th>
                <th>Voluntario</th>
                <th>Fecha / Hora</th>
                <th>Promedio nota</th>
                <th>Evaluar (1-7)</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla">
            <tr th:each="av : ${avistamientos}" th:attr="data-id=${av.id}">
                <td th:text="${av.ave != null ? av.ave.nombre : ''}"></td>
                <td th:text="${av.tipo}"></td>
                <td th:text="${av.lugar}"></td>
                <td th:text="${(av.voluntario != null and av.voluntario.comuna != null) ? av.voluntario.comuna.nombre : ''}"></td>
                <td th:text="${av.voluntario != null ? av.voluntario.nombre + ' ' + av.voluntario.apellido : ''}"></td>
                <td th:text="${av.fechaHora}"></td>
                <td>
                    <strong th:id="'promedio-' + ${av.id}"
                            th:text="${promedios[av.id] != null ? promedios[av.id] : 0.0}">0.0</strong>
                </td>
                <td>
                    <select th:id="'nota-' + ${av.id}">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7" selected>7</option>
                    </select>
                    <button type="button" th:onclick="'enviarNota(' + ${av.id} + ')'">Evaluar</button>
                    <div class="mensaje" th:id="'msg-' + ${av.id}"></div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(avistamientos)}">
                <td colspan="8">No se encontraron avistamientos.</td>
            </tr>
        </tbody>
    </table>

    <script>
        const buscador = document.getElementById("buscador");
        const cuerpoTabla = document.getElementById("cuerpoTabla");

        function escaparHtml(texto) {
            const div = document.createElement("div");
            div.textContent = texto ?? "";
            return div.innerHTML;
        }

        function renderFilas(items) {
            if (!items || items.length === 0) {
                cuerpoTabla.innerHTML = '<tr><td colspan="8">No se encontraron avistamientos.</td></tr>';
                return;
            }

            cuerpoTabla.innerHTML = items.map(av => `
                <tr data-id="${av.id}">
                    <td>${escaparHtml(av.ave)}</td>
                    <td>${escaparHtml(av.tipo)}</td>
                    <td>${escaparHtml(av.lugar)}</td>
                    <td>${escaparHtml(av.comuna)}</td>
                    <td>${escaparHtml(av.voluntario)}</td>
                    <td>${escaparHtml(av.fechaHora)}</td>
                    <td><strong id="promedio-${av.id}">${Number(av.promedio ?? 0).toFixed(1)}</strong></td>
                    <td>
                        <select id="nota-${av.id}">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7" selected>7</option>
                        </select>
                        <button type="button" onclick="enviarNota(${av.id})">Evaluar</button>
                        <div class="mensaje" id="msg-${av.id}"></div>
                    </td>
                </tr>
            `).join("");
        }

        let temporizadorBusqueda = null;
        buscador.addEventListener("input", () => {
            clearTimeout(temporizadorBusqueda);
            temporizadorBusqueda = setTimeout(async () => {
                const q = encodeURIComponent(buscador.value.trim());
                const resp = await fetch(`/api/avistamientos?q=${q}`);
                if (resp.ok) {
                    const datos = await resp.json();
                    renderFilas(datos);
                }
            }, 200);
        });

        async function enviarNota(id) {
            const selectEl = document.getElementById(`nota-${id}`);
            const msgEl = document.getElementById(`msg-${id}`);
            const promEl = document.getElementById(`promedio-${id}`);
            const nota = Number(selectEl.value);

            msgEl.textContent = "";
            msgEl.className = "mensaje";

            const resp = await fetch(`/api/avistamientos/${id}/notas`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nota })
            });

            const data = await resp.json();
            if (!resp.ok) {
                msgEl.textContent = data.error || "Error al guardar nota.";
                msgEl.classList.add("error");
                return;
            }

            promEl.textContent = Number(data.promedio).toFixed(1);
            msgEl.textContent = `Nota ${data.notaAgregada} guardada`;
        }
    </script>

</body>
</html>
